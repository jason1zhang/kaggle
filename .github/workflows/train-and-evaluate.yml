name: ML Model Training & Evaluation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10"] # 在多个Python版本上测试
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # 拉取代码
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' # 缓存依赖，加速后续构建
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jupyter nbconvert
      
      - name: Run sentiment analysis notebook
        run: |
          jupyter nbconvert --to notebook --execute --output executed_notebook.ipynb tweet_sentiment_analysis.ipynb
      
      - name: Verify model output files
        run: |
          echo "✅ Notebook executed successfully!"
          ls -la
      
      - name: Upload trained model as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            best_model.bin
            executed_notebook.ipynb
